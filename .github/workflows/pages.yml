name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack WebP art and PNG icons (stored as base64 tar packs)
        run: |
          for p in art/pack*.b64; do base64 -d "$p" | tar -x -C art; done
          rm -f art/pack*.b64
          for p in icons/pack*.b64; do base64 -d "$p" | tar -x -C icons; done
          rm -f icons/pack*.b64
          ls -la icons
          ls -la art
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: d
        uses: actions/deploy-pages@v4
