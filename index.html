<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#e8d3a6">
<title>EISH! Ways to Go</title>
<meta name="description" content="Lekker little ways to get into trouble in Mzansi. Rapid-fire microgames, 3 lives. Free, offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preload" href="art/lg.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="app"><div class="band top"></div><div class="band bot"></div>
  <section id="title" class="screen active">
    <h1 aria-label="EISH! Ways to Go"><span class="col"><b>E</b><b>I</b><b>S</b><b>H</b><b>!</b></span><span class="sub">Ways to Go</span></h1>
    <p class="tag">Lekker little ways to get into trouble in Mzansi</p>
    <canvas id="castc" aria-label="The cast: tap one!"></canvas>
    <button class="big" id="playBtn">PLAY</button>
    <button id="collBtn">Deaths collected: <span id="collCount">0</span>/<span id="collTotal">16</span></button>
    <button id="muteBtn">Sound on</button>
    <p class="best">Best: <span id="bestTitle">0</span></p>
    <p class="disclaim">A silly, fictional cartoon game. No beans were harmed. Probably.</p>
  </section>
  <section id="play" class="screen full"><canvas id="mgc"></canvas></section>
  <section id="over" class="screen">
    <p class="small">You survived</p>
    <div class="dayscore"><span id="sScore">0</span> <span id="sUnit">chaoses</span></div>
    <p id="sCap" class="capline"></p>
    <p id="sBest" class="newbest"></p>
    <button class="big" id="shareBtn">Share my chaos</button>
    <button id="againBtn">Again!</button>
    <button id="overColl">Death collection</button>
    <button id="menuBtn">Main menu</button>
    <p id="toast"></p>
  </section>
  <section id="coll" class="screen">
    <h2>Death collection</h2>
    <div id="collList"></div>
    <h2 class="h2s">The cast</h2>
    <ul id="castList"></ul>
    <button id="collBack">Back</button>
  </section>
</div>
<script src="game.js"></script>
</body></html>
