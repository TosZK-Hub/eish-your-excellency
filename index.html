<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c45c32">
<title>EISH! Khaya Lane</title>
<meta name="description" content="A small South African neighbourhood to farm, build, and grow. No raids, no accounts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot" role="status"><p class="mark">EISH!</p><p>Opening the lane…</p></div>
<div id="app">
  <header>
    <div class="brand"><b>EISH!</b><span>Khaya Lane</span><p id="buildTag" class="stamp"></p></div>
    <div class="level" title="Lane level">
      <b id="lv">1</b>
      <div class="meter xp" aria-hidden="true"><span id="xpfill"></span></div>
    </div>
    <button type="button" id="mute" aria-pressed="false" aria-label="Sound">Sound</button>
    <div class="notes" id="notes">0</div>
  </header>
  <div class="res" id="res"></div>
  <div class="stage"><canvas id="view" aria-label="Your neighbourhood"></canvas></div>
  <button type="button" id="placing" data-act="cancel" hidden>Cancel</button>
  <section class="dock" id="dock">
    <ul class="goals" id="goals"></ul>
    <div class="card" id="card"></div>
    <div class="bar">
      <button type="button" data-act="build">Build</button>
      <button type="button" data-act="skills">Skills</button>
      <button type="button" data-act="play">Play</button>
      <button type="button" data-act="more">Lane</button>
    </div>
  </section>
</div>
<div id="modal" class="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header>
      <h2 id="modalTitle"></h2>
      <button type="button" data-close>Close</button>
    </header>
    <div id="modalBody"></div>
  </div>
</div>
<p id="toast" class="toast" hidden></p>
<p id="cheer" class="cheer" hidden></p>
<script src="game.js"></script>
</body>
</html>
